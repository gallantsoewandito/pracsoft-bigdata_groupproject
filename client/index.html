<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant Messaging</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body>

    <!-- Login Screen -->
  <div id="login-screen" class="is-flex is-justify-content-center is-align-items-center">
    <div class="box login-box">
      <h1 class="title is-4 has-text-centered mb-5">
        <i class="fas fa-comments mr-2"></i>Instant Messaging
      </h1>
      
      <div class="field">
        <div class="control has-icons-left">
          <input id="username-input" class="input is-medium" type="text" placeholder="Username" autocomplete="off" />
          <span class="icon is-small is-left"><i class="fas fa-user"></i></span>
        </div>
      </div>

      <div class="field">
        <div class="control has-icons-left">
          <input id="password-input" class="input is-medium" type="password" placeholder="Password" />
          <span class="icon is-small is-left"><i class="fas fa-lock"></i></span>
        </div>
        <p class="help is-info is-size-7 mt-1">
          Must be 8+ characters, include 1 uppercase letter, and 1 number.
        </p>
      </div>

      <button id="auth-btn" class="button is-primary is-medium is-fullwidth mb-3">Log In</button>
      
      <p class="has-text-centered">
        <a id="toggle-auth-mode" class="is-size-7" style="cursor: pointer; color: #3273dc;">Need an account? Sign Up</a>
      </p>
      
      <p id="login-error" class="help is-danger has-text-centered mt-3"></p>
    </div>
  </div>

  <!-- Main Application -->
  <div id="app" class="is-hidden">
    <div class="columns is-gapless is-mobile app-container">
      
            <!-- Sidebar -->
      <div class="column is-3-widescreen is-4-tablet sidebar">
        <div class="sidebar-section">
          <button id="new-group-chat-btn" class="button is-primary is-small is-fullwidth mb-3">
            <span class="icon"><i class="fas fa-users"></i></span>
            <span>New Group Chat</span>
          </button>

          <div class="field sidebar-search-field">
            <div class="control has-icons-left">
              <input
                id="sidebar-search-input"
                class="input is-small"
                type="search"
                placeholder="Search users or chats..."
                autocomplete="off"
              />
              <span class="icon is-small is-left"><i class="fas fa-magnifying-glass"></i></span>
            </div>
          </div>
          
          <!-- This single list will hold both groups and direct messages -->
          <ul id="online-users-list" class="user-list"></ul>
        </div>
      </div>

      <!-- Main Chat Panel -->
      <div class="column main-panel">
        <div id="active-conversation-header" class="chat-header">
          <div class="chat-header-title-wrap">
            <span id="active-conversation-title" class="title is-5 mb-0">Select a user</span>
            <span id="active-conversation-members" class="is-size-7 has-text-grey ml-2"></span>
          </div>

          <div class="chat-header-actions">
            <div class="message-search-controls">
              <div class="control has-icons-left message-search-input-wrap">
                <input
                  id="message-search-input"
                  class="input is-small"
                  type="search"
                  placeholder="Search messages..."
                  autocomplete="off"
                  disabled
                />
                <span class="icon is-small is-left"><i class="fas fa-magnifying-glass"></i></span>
              </div>
              <span id="message-search-count" class="message-search-count">0/0</span>
              <button id="message-search-prev" class="button is-small is-light" type="button" title="Previous match" disabled>
                <span class="icon is-small"><i class="fas fa-chevron-up"></i></span>
              </button>
              <button id="message-search-next" class="button is-small is-light" type="button" title="Next match" disabled>
                <span class="icon is-small"><i class="fas fa-chevron-down"></i></span>
              </button>
              <button id="message-search-clear" class="button is-small is-light" type="button" title="Clear search" disabled>
                <span class="icon is-small"><i class="fas fa-xmark"></i></span>
              </button>
            </div>

            <button id="leave-group-btn" class="button is-small is-danger is-light is-hidden" type="button">
              <span class="icon"><i class="fas fa-right-from-bracket"></i></span>
              <span>Leave group</span>
            </button>
          </div>
        </div>

        <div id="message-history" class="message-history"></div>
        <div id="typing-indicator" class="typing-indicator"></div>

        <form id="message-input-form" class="chat-input-area">
          <div class="field has-addons is-expanded chat-compose-row">
            <div class="control">
              <button id="attach-file-btn" type="button" class="button is-light is-rounded" title="Attach files">
                <span class="icon"><i class="fas fa-paperclip"></i></span>
              </button>
              <input id="attachment-input" class="is-hidden" type="file" multiple />
            </div>
            <div class="control is-expanded">
              <input id="message-input" class="input is-rounded" type="text" placeholder="Type a message or paste a link..." autocomplete="off" />
            </div>
            <div class="control">
              <button type="submit" class="button is-primary is-rounded">
                <span class="icon"><i class="fas fa-paper-plane"></i></span>
              </button>
            </div>
          </div>
          <div id="upload-status" class="upload-status" aria-live="polite"></div>
        </form>
      </div>

    </div>
  </div>

  <!-- Group Chat Modal -->
  <div id="group-modal" class="modal">
    <div class="modal-background" id="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title">Create Group Chat</p>
        <button class="delete" id="close-modal-btn" aria-label="close"></button>
      </header>
      <section class="modal-card-body">
        <div class="field">
          <label class="label" for="group-name-input">Group name</label>
          <div class="control">
            <input id="group-name-input" class="input" type="text" maxlength="40" placeholder="e.g. Project Team" autocomplete="off" />
          </div>
        </div>
        <p class="mb-3">Select members to invite:</p>
        <div id="group-member-list" class="group-member-list"></div>
      </section>
      <footer class="modal-card-foot">
        <button id="confirm-group-btn" class="button is-success">Create Group</button>
        <button class="button" id="cancel-modal-btn">Cancel</button>
      </footer>
    </div>
  </div>

  <div id="invite-modal" class="modal">
    <div class="modal-background" id="invite-modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title">Group Invitation</p>
        <button class="delete" id="close-invite-modal-btn" aria-label="close"></button>
      </header>
      <section class="modal-card-body" id="invite-modal-body"></section>
    </div>
  </div>

  <script type="module" src="client.js"></script>
</body>
</html>
